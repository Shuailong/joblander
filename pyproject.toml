[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "joblander"
version = "0.1.0"
description = "Multi-agent engine for running a job search"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "fastapi>=0.110",           # web 作战室
    "uvicorn>=0.27",            # web 作战室的 ASGI server
    "jinja2>=3.1",              # 模板渲染
    "python-multipart>=0.0.9",  # 表单 POST（Form(...)）
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]   # httpx: fastapi TestClient 依赖

[project.scripts]
joblander = "joblander.__main__:main"

# 显式声明包：仓库根还有 site/（官网静态页）与 tests/，
# 扁平布局自动发现会因「多个顶层包」直接拒绝构建。
[tool.setuptools]
packages = ["joblander", "joblander.web", "evals"]

[tool.setuptools.package-data]
"joblander.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
