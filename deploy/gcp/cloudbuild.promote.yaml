# 灰度转正（或回滚）：_ROLLBACK=1 时把流量全部切回上一个稳定 revision。
substitutions:
  _REGION: asia-southeast1
  _PROD_PROJECT: joblander-prod
  _ROLLBACK: "0"
options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - id: traffic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args: [deploy/gcp/promote.sh, "${_PROD_PROJECT}", "${_REGION}", "${_ROLLBACK}"]   # 脚本里的 shell 变量不经 Cloud Build 替换
